server {
    listen 80;
    server_name foodtotry.giraffish.top;
    return 301 https://$host$request_uri;
}

server {
    listen 172.17.9.183:443 ssl;
    server_name foodtotry.giraffish.top;

    ssl_certificate /etc/letsencrypt/live/foodtotry.giraffish.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodtotry.giraffish.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32k;

    location / {
        limit_req zone=large_stomach_candidates burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
